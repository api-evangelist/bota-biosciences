aid: bota-biosciences
name: Bota Biosciences
description: 'Bota Biosciences (Bota Bio, 恩和科技) is an industrial and synthetic biology
  company that applies AI-driven computation and laboratory automation to bio-manufacturing.
  Its in-house Bota Biofoundry and Cell2Cloud platforms combine computational algorithms,
  non-model industrial strain engineering, rapid iterative enzyme engineering and performance
  protein design to shorten design-build-test-learn cycles, and in March 2026 it launched
  SAION AI, a three-layer "Physical AI" platform (cognition, orchestration, execution)
  that drives laboratory hardware through a proprietary Biological Protocol Language.
  Bota commercializes this work as physical ingredients rather than software: Purtect
  bio-preservatives (nisin, natamycin, ε-poly-lysine, lysozyme), Prorylia biomimetic
  proteins and Re² Coffea Arabica peptides, sold through its HeliaGenesis food and
  nutrition brand and its YuccaElements personal care brand, with partnerships including
  BASF, Proya, Syensqo and Puratos. Founded in 2019 with operations in Hangzhou, China
  and the San Francisco Bay Area, Bota publishes no developer portal, no public API
  documentation, no SDKs and no machine-readable specification; its computational software
  is internal laboratory tooling and its SAION AI application is reachable only through
  a login with an administrator-managed account whitelist.'
