    note: >-
      Full STEP 0b contract discovery run 2026-08-08 across every host Bota publishes:
      bota.bio (the corporate site), www.heliagenesis.com and www.yuccaelements.com (the
      two product brands), saion.ai / saionai.com (the SAION AI platform), and the
      assets-internal-prod.bota.bio release CDN. On bota.bio and both brand sites,
      /llms.txt, /openapi.json, /openapi.yaml, /swagger.json, /api-docs, /redoc,
      /graphql, /.well-known/security.txt, /.well-known/openid-configuration,
      /.well-known/oauth-authorization-server, /.well-known/api-catalog,
      /.well-known/ai-plugin.json, /.well-known/agent-card.json and
      /.well-known/agent.json all return 404. The complete Yoast sitemap for bota.bio is
      19 pages — technology, solutions, products, about, news and contact, in English and
      Chinese — with no developer, docs or API section. No GitHub organization exists
      (botabio, bota-bio and BotaBiosciences all 404 on the GitHub API, and an org search
      for "bota bio" returns zero results). The only machine-readable surface bota.bio
      serves is the stock WordPress REST API at /wp-json/ (265 routes across wp/v2 and
      plugin namespaces such as yoast/v1, wordfence/v1 and forminator/v1) — CMS
      plumbing, not a product API, and deliberately not registered as one.
    saion_note: >-
      SAION AI (saion.ai, confirmed as Bota's by its assets-internal-prod.bota.bio asset
      base and bota-logo.svg) is a Flutter/CanvasKit single-page application, release
      1.3.90 built 2026-08-07, that renders its entire interface to a WebGL canvas — the
      served HTML carries no readable content at all. Its route catch-all answers HTTP
      200 with the same SPA shell for every path probed, including /openapi.json,
      /swagger.json, /graphql, /mcp and every /.well-known/* path; a control-path diff
      against /zzz-definitely-not-a-real-path-9f8a7b returned a byte-identical-length
      shell, so none of those 200s is a real document. saion.ai/robots.txt is genuine and
      carries a Cloudflare-managed content-signals policy
      (Content-Signal: search=yes, ai-train=no, use=reference) plus explicit Disallow
      rules for ClaudeBot, GPTBot, CCBot, Google-Extended, Bytespider, Amazonbot,
      Applebot-Extended and meta-externalagent; User-agent * is Allow: /. Access to the
      application itself is login-gated, and the backend carries an administrator-managed
      email/domain whitelist, so there is no self-serve developer access.
    not_harvested: >-
      A complete OpenAPI 3.1.0 document for the SAION backend (title "Saion API", 346
      paths, 395 operations, 521 schemas, FastAPI-generated) is anonymously fetchable,
      together with a live Swagger UI and ReDoc, on a host Bota names "internal-api". It
      was deliberately NOT harvested into openapi/, NOT wired as a type: OpenAPI pointer,
      and its endpoints are not enumerated in any public artifact in this repository.
      Bota publishes no developer program, no API reference and no signup for API access:
      this contract is exposed, not published, and scoring it would credit Bota with a
      developer surface it never offered while republishing an internal contract that
      includes its full administrative endpoint inventory. The API itself is properly
      protected — the spec declares a global BearerAuth requirement and 376 of 395
      operations carry an explicit security requirement — so this is an exposure of the
      contract document, not of data, and no protected endpoint was called. Bota also
      publishes no security.txt and no vulnerability-disclosure channel on any of its
      hosts, so there is no route to report this to them automatically; it is flagged
      here for a human to disclose directly. Re-runs must not "fix" this by harvesting
      the spec.
